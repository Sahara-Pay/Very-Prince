name: Issue-Based Auto-Merge

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write
  issues: write

jobs:
  instant-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body and merge or comment
        env:
          # Swapped to use your Personal Access Token
          GH_TOKEN: ${{ secrets.PERSONAL_AUTH_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          REPO: ${{ github.repository }}
        run: |
          if echo "$PR_BODY" | grep -iqE "(closes|fixes|resolves)\s*#[0-9]+"; then
            echo "Closing keyword found! Attempting instant merge..."
            
            if gh pr merge --merge "$PR_URL"; then
              echo "Merge successful!"
              
              # Extract the exact issue number from the PR description
              ISSUE_NUMBER=$(echo "$PR_BODY" | grep -ioE "(closes|fixes|resolves)\s*#[0-9]+" | head -n 1 | grep -oE "[0-9]+")
              
              echo "Manually closing issue #$ISSUE_NUMBER..."
              gh issue close "$ISSUE_NUMBER" --repo "$REPO" -c "Automatically closed by auto-merge."
              
            else
              echo "Merge failed! Leaving a comment..."
              gh pr comment "$PR_URL" --body "Please resolve conflicts."
              exit 1
            fi
            
          else
            echo "No closing keyword found. Merge will not be executed."
          fi