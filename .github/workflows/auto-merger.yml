name: Issue-Based Auto-Merge

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  pull-requests: write
  contents: write

jobs:
  instant-merge:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR body and merge instantly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          if echo "$PR_BODY" | grep -iqE "(closes|fixes|resolves)\s*#[0-9]+"; then
            echo "Closing keyword found! Merging instantly..."
            gh pr merge --merge "$PR_URL"
          else
            echo "No closing keyword found. Merge will not be executed."
          fi