---
# Application user secret – referenced by Cluster.bootstrap.initdb.secret
# Replace base64-encoded values before applying.
#   echo -n 'very_prince_app' | base64
#   echo -n '<strong-password>'  | base64
#
# For production, prefer Sealed Secrets or External Secrets Operator.
apiVersion: v1
kind: Secret
metadata:
  name: very-prince-pg-app-secret
  namespace: very-prince
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: very-prince
type: kubernetes.io/basic-auth
stringData:
  username: very_prince_app
  # CHANGE THIS before applying to any non-ephemeral environment
  password: "CHANGE_ME_APP_PASSWORD"

---
# Superuser (postgres) secret – referenced by Cluster.superuserSecret
apiVersion: v1
kind: Secret
metadata:
  name: very-prince-pg-superuser-secret
  namespace: very-prince
  labels:
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: very-prince
type: kubernetes.io/basic-auth
stringData:
  username: postgres
  # CHANGE THIS before applying to any non-ephemeral environment
  password: "CHANGE_ME_SUPERUSER_PASSWORD"

---
# MinIO S3 credentials – used by barman-cloud WAL archiving
apiVersion: v1
kind: Secret
metadata:
  name: minio-s3-secret
  namespace: very-prince
  labels:
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: very-prince
type: Opaque
stringData:
  ACCESS_KEY_ID: "minioadmin"
  # CHANGE THIS before applying to any non-ephemeral environment
  SECRET_ACCESS_KEY: "CHANGE_ME_MINIO_SECRET"

---
# PgBouncer auth secret – plain-text user list consumed by userlist.txt
# Format per line: "username" "password"
# CloudNativePG will auto-sync this from the app user secret; the entry
# below acts as the fallback for manual pgbouncer deployments.
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-userlist-secret
  namespace: very-prince
  labels:
    app.kubernetes.io/component: pgbouncer
    app.kubernetes.io/part-of: very-prince
type: Opaque
stringData:
  userlist.txt: |
    "very_prince_app" "CHANGE_ME_APP_PASSWORD"
