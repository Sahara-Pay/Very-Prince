[package]
name = "very-prince-contracts"
version = "0.1.0"
edition = "2021"
description = "PayoutRegistry — multi-organization maintenance payout smart contract on Stellar Soroban."
license = "MIT"

# ── Build Target ──────────────────────────────────────────────────────────────
# cdylib is required by Soroban — the contract is compiled to a WASM shared library.
[lib]
crate-type = ["cdylib"]

# ── Runtime Dependencies ──────────────────────────────────────────────────────
[dependencies]
# Official Soroban SDK — Protocol 22 compatible.
soroban-sdk = { version = "22.0.0" }

# BLS12-381 pairing-friendly elliptic curve for signature aggregation.
# Used for massive multi-sig DAO approvals to reduce gas costs.
bls12_381_plus = { version = "0.8", default-features = false, features = ["groups", "pairings", "hashing"] }
sha2 = { version = "0.10", default-features = false }

# ── Dev/Test Dependencies ─────────────────────────────────────────────────────
# The "testutils" feature unlocks Address::generate(), mock_all_auths(), etc.
[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1.6.0"
rand = "0.8"
rand_core = "0.6"
rand_chacha = "0.3"

# ── Release Profile ───────────────────────────────────────────────────────────
# These settings minimise WASM binary size for on-chain deployment.
[profile.release]
opt-level      = "z"       # Optimise for binary size
overflow-checks = true     # Keep checked arithmetic (security)
debug           = 0
strip           = "symbols"
debug-assertions = false
panic           = "abort"  # Minimal panic handler for WASM
codegen-units   = 1        # Single codegen unit for maximum LTO benefit
lto             = true

# ── Release-with-logs Profile ─────────────────────────────────────────────────
# Used during development/debugging — identical to release but with assertions enabled.
[profile.release-with-logs]
inherits         = "release"
debug-assertions = true
